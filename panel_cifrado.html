<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>{{NOMBRE}}</title>
<style>
:root{color-scheme:light dark;--bg:#0f1115;--fg:#e8e8ea;--mut:#9aa0a6;--card:#181b22;--line:#2a2f3a}
@media (prefers-color-scheme:light){:root{--bg:#f6f7f9;--fg:#15171c;--mut:#5f6368;--card:#fff;--line:#e3e5e8}}
*{box-sizing:border-box}body{margin:0;font:16px/1.45 -apple-system,system-ui,sans-serif;background:var(--bg);color:var(--fg)}
main{max-width:980px;margin:auto;padding:20px}a{color:inherit}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-top:16px}
.hero{border-radius:14px;padding:20px 22px;color:#fff}.hero h1{margin:0;font-size:28px}.hero p{margin:6px 0 0}
h2{font-size:16px;margin:0 0 10px}table{width:100%;border-collapse:collapse}
td{border-top:1px solid var(--line);padding:8px 6px;vertical-align:top}
.pill{color:#fff;border-radius:99px;padding:2px 8px;font-size:12px;white-space:nowrap}
.det{color:var(--mut);font-size:13px}ul{margin:0;padding-left:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
input,button{font:inherit;padding:12px 14px;border-radius:10px;border:1px solid var(--line);width:100%}
button{background:#2b6cb0;color:#fff;border:0;margin-top:10px;font-weight:600;min-height:44px}
label.chk{display:flex;gap:8px;align-items:center;margin-top:10px;font-size:14px}label.chk input{width:auto}
#err{color:#e53e3e;margin-top:8px;min-height:1.2em}
@media (max-width:600px){td:nth-child(2),td:nth-child(4){display:none}.hero h1{font-size:24px}}
.hero .h1{font-size:30px;font-weight:800}.hero p{margin:6px 0 0}.peq{opacity:.85;font-size:13px}
h2{display:flex;justify-content:space-between;align-items:center;gap:8px}
.lista{list-style:none;padding:0;margin:0}.lista li{padding:10px 0;border-top:1px solid var(--line)}.lista li:first-child{border-top:0}
.sig{display:flex;gap:10px;align-items:flex-start}.dot{flex:0 0 10px;height:10px;border-radius:50%;margin-top:6px}
.nota a,.sig a{text-decoration:none;font-weight:600}.nota a:hover,.sig a:hover{text-decoration:underline}
details summary{cursor:pointer;margin-top:8px;font-weight:600}.av{padding-left:4px;list-style:none}.av li{padding:4px 0}
.cols{columns:2;column-gap:16px;font-size:14px}.sec2{width:auto;background:#555}
.titsec{font-size:17px;margin:22px 0 4px;display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:6px}
.gridm{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.med{margin-top:12px;padding:12px}.med summary{list-style:none;cursor:pointer;text-align:center}.med summary::-webkit-details-marker{display:none}
.med[open]{grid-column:1/-1;text-align:left}.gauge{width:120px;height:70px;display:block;margin:0 auto}
.gnum{font-size:20px;font-weight:800;fill:var(--fg)}.mtit{font-weight:700;margin:2px 0 4px}
</style></head><body><main>
<div id="login" class="card" style="max-width:420px;margin:12vh auto 0">
  <h2>🔒 {{NOMBRE}}</h2>
  <p class="det">Contenido cifrado. Escribe la frase clave familiar.</p>
  <form id="f"><input id="k" type="password" autocomplete="current-password" placeholder="Frase clave" aria-label="Frase clave" required>
  <label class="chk"><input id="rec" type="checkbox"> Recordar en este dispositivo</label>
  <button type="submit">Abrir</button><div id="err" role="alert"></div></form>
</div>
<div id="app" hidden></div>
</main>
<script>
const NIV=["NORMAL","VIGILANCIA","ELEVADO","ALTO","CRÍTICO"],EMO=["🟢","🔵","🟡","🟠","🔴"],
      COL=["#1f9d55","#2b6cb0","#c99a06","#dd6b20","#c53030"];
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safeUrl=u=>/^https?:\/\//i.test(u||"")?u:"#";
async function descifrar(clave){
  const r=await fetch("estado.enc?t="+Date.now(),{cache:"no-store"});
  if(r.status===404) throw new Error("Todavía no hay datos: el motor aún no ha corrido. Ejecuta el Paso 4 (Actions → Run workflow) y vuelve en 2–3 minutos.");
  if(!r.ok) throw new Error("No se pudo descargar el estado ("+r.status+")");
  const e=await r.json();
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(clave),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(e.salt),iterations:e.iter,hash:"SHA-256"},
             base,{name:"AES-GCM",length:256},false,["decrypt"]);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(e.iv)},key,b64(e.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}
const SEC={pr:["🇵🇷","Puerto Rico"],eeuu:["🇺🇸","Estados Unidos"],amenazas:["⚠️","Amenazas a Norteamérica"],
  militar:["⚓","Militar y naval · Caribe"],infra:["🛰️","Infraestructura y espacio"]};
const SECT={telecom:"📡",ciber:"💻",electrica:"⚡",ataque:"🚀",terror:"🛡️",emergencia:"🚨",espacio:"🛰️",caribe:"⚓",pr:"🇵🇷"};
function hace(iso){const m=Math.round((Date.now()-new Date(iso))/60000);
  if(m<1)return"ahora"; if(m<60)return`hace ${m} min`; const h=Math.round(m/60); return h<24?`hace ${h} h`:`hace ${Math.round(h/24)} d`;}
function fuenteDe(t){const i=t.lastIndexOf(" - ");return i>0?[t.slice(0,i),t.slice(i+3)]:[t,""];}
function pintar(d){
  const n=d.nivel, sen=d.senales||[];
  const tarjetas=Object.entries(SEC).map(([k,[ico,nom]])=>{
    const ss=sen.filter(s=>(s.seccion||"infra")===k && s.seccion!=="medidores");
    const peor=ss.reduce((a,s)=>Math.max(a,s.nivel),0);
    const filas=ss.map(s=>`<li class="sig"><span class="dot" style="background:${COL[s.nivel]}"></span>
      <div><a href="${esc(safeUrl(s.url))}" target="_blank" rel="noopener">${esc(s.titulo)}</a>
      <div class="det">${esc(s.fuente)}${s.detalle?" · "+esc(s.detalle):""}</div></div></li>`).join("");
    let extra="";
    if(k==="militar"){const av=d.aviones_militares||[];
      extra= av.length?`<details><summary>${av.length} aeronave(s) militar(es) con transpondedor</summary><ul class="av">${
        av.map(a=>`<li>${a.cerca_pr?"📍":"✈️"} <b>${esc(a.callsign)}</b> ${esc(a.tipo)} ${a.desc?"· "+esc(a.desc):""}
        <span class="det">${a.lat}, ${a.lon}${a.alt?" · "+esc(a.alt)+" ft":""}</span></li>`).join("")}</ul></details>`
        :`<p class="det">Ninguna aeronave militar con transpondedor visible ahora sobre el Caribe (muchas vuelan sin él).</p>`;}
    return `<section class="card sec"><h2><span>${ico} ${nom}</span><span class="pill" style="background:${COL[peor]}">${NIV[peor]}</span></h2>
      ${filas?`<ul class="lista">${filas}</ul>`:`<p class="det">Sin novedades.</p>`}${extra}</section>`;}).join("");
  const tit=(d.titulares||[]).map(t=>{const [h,f]=fuenteDe(t.titulo);const ico=SECT[t.seccion]||(SEC[t.seccion]||["📰"])[0];
    return `<li class="nota"><a href="${esc(safeUrl(t.url))}" target="_blank" rel="noopener">${esc(h)}</a>
    <div class="det">${ico} ${esc(t.tema)} · ${esc(f)} · ${hace(t.hora_utc)}</div></li>`}).join("")||`<li class="det">Sin titulares recientes.</li>`;
  const hist=(d.historial||[]).slice(0,15).map(h=>`<li>${EMO[h.nivel]} ${esc(h.titulo)} <span class="det">· ${hace(h.hora_utc)}</span></li>`).join("")||`<li class="det">Sin alertas registradas.</li>`;
  const fu=Object.entries(d.fuentes||{}).map(([k,v])=>`<li>${v.ok?"✅":"⚠️"} ${esc(k)}</li>`).join("");
  const man=(d.consulta_manual||[]).map(m=>`<li><a href="${esc(safeUrl(m.url))}" target="_blank" rel="noopener">${esc(m.nombre)}</a></li>`).join("");
  const med=(d.medidores||[]).map(m=>{const pct=Math.max(0,Math.min(100,m.indice)),c=COL[m.nivel];
    const arco=Math.PI*40, lleno=arco*pct/100;
    const tend=m.base==null?"aprendiendo lo normal…":(m.n24>m.base*1.5?`▲ sobre lo normal (${m.base}/día)`:m.n24<m.base*0.7?`▼ bajo lo normal (${m.base}/día)`:`≈ normal (${m.base}/día)`);
    const tl=(m.titulares||[]).map(t=>{const [h,f]=fuenteDe(t.titulo);return `<li><a href="${esc(safeUrl(t.url))}" target="_blank" rel="noopener">${esc(h)}</a><div class="det">${esc(f)} · ${hace(t.hora_utc)}</div></li>`}).join("")||`<li class="det">Sin noticias.</li>`;
    return `<details class="card med"><summary>
      <svg viewBox="0 0 100 58" class="gauge" aria-hidden="true"><path d="M10 50 A40 40 0 0 1 90 50" fill="none" stroke="var(--line)" stroke-width="10" stroke-linecap="round"/>
      <path d="M10 50 A40 40 0 0 1 90 50" fill="none" stroke="${c}" stroke-width="10" stroke-linecap="round" stroke-dasharray="${lleno} ${arco}"/>
      <text x="50" y="48" text-anchor="middle" class="gnum">${pct}</text></svg>
      <div class="mtit">${m.icono} ${esc(m.nombre)}</div>
      <div class="det"><span class="pill" style="background:${c}">${NIV[m.nivel]}</span> ${m.n3} en 3 h · ${m.n24} en 24 h</div>
      <div class="det">${esc(m.motivo||tend)}</div></summary><ul class="lista">${tl}</ul></details>`}).join("");
  const app=document.getElementById("app");
  app.innerHTML=`<div class="hero" style="background:${COL[n]}"><div class="h1">${EMO[n]} ${NIV[n]}</div>
    <p>${esc(d.resumen)}</p><p class="peq">Revisado ${hace(d.actualizado_utc)} · motor ${esc(d.motor)}</p></div>
    <h2 class="titsec">🧭 Medidores de seguridad nacional <span class="det">toca uno para ver sus noticias</span></h2>
    <div class="gridm">${med}</div>
    <h2 class="titsec">📌 Señales oficiales y técnicas</h2>
    <div class="grid">${tarjetas}</div>
    <section class="card"><h2><span>📰 Titulares en vivo</span><span class="det">prensa · sin verificar</span></h2><ul class="lista">${tit}</ul></section>
    <div class="grid"><section class="card"><h2>🕘 Historial de alertas</h2><ul>${hist}</ul></section>
    <section class="card"><h2>🔌 Fuentes</h2><ul class="cols">${fu}</ul></section>
    <section class="card"><h2>🔎 Consulta manual</h2><ul class="cols">${man}</ul></section></div>
    <p class="det"><button id="salir" class="sec2">Cerrar sesión en este dispositivo</button></p>`;
  document.getElementById("login").hidden=true; app.hidden=false;
  document.getElementById("salir").onclick=()=>{try{localStorage.removeItem("cf_k")}catch(e){} location.reload()};
}
async function abrir(clave,recordar){
  const err=document.getElementById("err"); err.textContent="Descifrando…";
  try{ const d=await descifrar(clave); err.textContent="";
       if(recordar){try{localStorage.setItem("cf_k",clave)}catch(e){}}
       pintar(d); setTimeout(()=>abrir(clave,false),300000);
  }catch(e){ err.textContent = e.name==="OperationError" ? "Frase clave incorrecta." : e.message; }
}
document.getElementById("f").onsubmit=ev=>{ev.preventDefault();
  abrir(document.getElementById("k").value,document.getElementById("rec").checked)};
let guardada=null; try{guardada=localStorage.getItem("cf_k")}catch(e){}
if(guardada) abrir(guardada,false);
</script></body></html>
