function ic(n,c){return `<svg class="${c||"i"}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[n]||""}</svg>`}
const NIV=["NORMAL","VIGILANCIA","ELEVADO","ALTO","CRÍTICO"],EMO=["🟢","🔵","🟡","🟠","🔴"],
      COL=["#2FBF71","#3B8CF6","#E9A825","#F07A2B","#E5484D"];
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safeUrl=u=>/^https?:\/\//i.test(u||"")?u:"#";
async function cargarEstado(){
  const r=await fetch("estado.json?t="+Date.now(),{cache:"no-store"});
  if(!r.ok) throw new Error("No se pudo descargar el estado ("+r.status+"). Vuelve a intentar en unos minutos.");
  return r.json();
}
const SEC={pr:["pin","Puerto Rico"],eeuu:["bandera","Estados Unidos"],amenazas:["alerta","Amenazas a Norteamérica"],
  militar:["ancla","Militar y naval · Caribe"],infra:["satelite","Infraestructura y espacio"]};
const SECT={telecom:"antena",ciber:"ciber",electrica:"rayo",ataque:"mira",terror:"escudo",emergencia:"alerta",espacio:"satelite",caribe:"ancla",pr:"pin"};
const EIC={"📡":"antena","💻":"ciber","⚡":"rayo","🚀":"mira","🛡️":"escudo","🛡":"escudo","🚨":"alerta","🚢":"puerto","🛰️":"satelite","🛰":"satelite","⚓":"ancla","🇵🇷":"pin"};
function hace(iso){const m=Math.round((Date.now()-new Date(iso))/60000);
  if(m<1)return"ahora"; if(m<60)return`hace ${m} min`; const h=Math.round(m/60); return h<24?`hace ${h} h`:`hace ${Math.round(h/24)} d`;}

// ---------------- ventana inferior ----------------
function abrirHoja(html){const h=document.getElementById("hoja");document.getElementById("hojaCont").innerHTML=html;h.classList.add("abierta");h.scrollTop=0;}
function cerrarHoja(){document.getElementById("hoja").classList.remove("abierta");}
document.addEventListener("keydown",e=>{if(e.key==="Escape")cerrarHoja()});
function dl(pares){return "<dl>"+pares.filter(p=>p[1]!==undefined&&p[1]!==null&&p[1]!=="").map(([k,v])=>`<dt>${esc(k)}</dt><dd>${v}</dd>`).join("")+"</dl>";}
function enlace(u,t){return `<a href="${esc(safeUrl(u))}" target="_blank" rel="noopener">${esc(t||"Abrir fuente")} ↗</a>`;}
// ---------------- utilidades geográficas ----------------
function destino(lat,lon,rumbo,km){const R=6371,d=km/R,b=rumbo*Math.PI/180,f1=lat*Math.PI/180,l1=lon*Math.PI/180;
  const f2=Math.asin(Math.sin(f1)*Math.cos(d)+Math.cos(f1)*Math.sin(d)*Math.cos(b));
  const l2=l1+Math.atan2(Math.sin(b)*Math.sin(d)*Math.cos(f1),Math.cos(d)-Math.sin(f1)*Math.sin(f2));
  return [f2*180/Math.PI,((l2*180/Math.PI+540)%360)-180];}
function partir(pts){const out=[[]];pts.forEach((p,i)=>{if(i&&Math.abs(p[1]-pts[i-1][1])>180)out.push([]);out[out.length-1].push(p)});return out;}
const AZUL="#4DA3FF",ROJO="#FF4D4D",AMAR="#FFD34D",VERDE="#22C55E",NARANJA="#FF8C1A";
const COLPAIS=p=>!p||/descon|sin |^\?/i.test(p)?AMAR:/^EE\. ?UU/.test(p)?AZUL:ROJO;
const COLSAT=s=>s.categoria==="no_identificado"?AMAR:/^EE\. ?UU/.test(s.pais||"")?AZUL:ROJO;
const COLBUQ=b=>{const m=String(b.mmsi||"");if(!/^\d{9}$/.test(m))return AMAR;const mid=+m.slice(0,3);return (mid===338||(mid>=366&&mid<=369)||mid===303)?AZUL:(mid>=201&&mid<=775?ROJO:AMAR)};
const ARPT_PR={SJU:[18.4394,-66.0018],BQN:[18.4949,-67.1294],PSE:[18.0083,-66.563]};
const CPUERTO=n=>n>=3?"#e53935":n>=1?"#f2c230":"#22c55e";
const CTRI=n=>n>=3?ROJO:n>=1?AMAR:VERDE;
let MAPA=null,CAPAS={};
function pintarMapa(d){
  if(typeof L==="undefined"){document.getElementById("mapa").innerHTML='<p class="det" style="padding:16px">No se pudo cargar el mapa (sin conexión a internet).</p>';return;}
  const m=d.mapa||{};
  if(!MAPA){MAPA=L.map("mapa",{zoomControl:false,worldCopyJump:true,attributionControl:true}).setView([19.2,-67.5],window.innerWidth<600?6:5);
    L.control.zoom({position:"bottomright"}).addTo(MAPA);
    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:12,className:"oscuro",referrerPolicy:"strict-origin-when-cross-origin",
      attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'}).addTo(MAPA);
    L.circle([18.22,-66.59],{radius:250000,color:"#4da3ff",weight:1,dashArray:"4 6",fill:false,interactive:false}).addTo(MAPA);
  }
  Object.values(CAPAS).forEach(c=>MAPA.removeLayer(c)); CAPAS={};
  const g=k=>(CAPAS[k]=L.layerGroup().addTo(MAPA));
  // --- restricciones aéreas ---
  const lt=g("tfr");
  (m.tfr||[]).forEach(t=>{const c=t.nueva?NARANJA:ROJO;
    const ab=()=>abrirHoja(`<h3 id="hojaTit">${ic("radar")} Restricción aérea ${esc(t.id)}</h3><p><span class="pill" style="background:${c};color:#000">${t.nueva?"Nueva (últimas 48 h)":"Lleva más de 48 h"}</span> ${esc(t.tipo)}</p>`+
      dl([["Lugar",esc(t.lugar)],["Motivo",esc(t.motivo||"No indicado")],["Altitud",esc(t.altitud)],["Estado",esc(t.estado)],["Creada",esc(t.creado)]])+
      (t.texto?`<details><summary>Texto oficial del NOTAM</summary><pre>${esc(t.texto)}</pre></details>`:"")+`<p>${enlace(t.url,"Ver en la FAA")}</p>`);
    (t.areas||[]).forEach(a=>{let f;
      if(a.tipo==="circulo")f=L.circle(a.centro,{radius:a.radio_m,color:c,weight:2,fillOpacity:.22});
      else f=L.polygon(a.puntos,{color:c,weight:2,fillOpacity:.22});
      f.on("click",ab).addTo(lt);});});
  // --- puertos ---
  const lp=g("puertos");
  (m.puertos||[]).forEach(p=>{const c=CPUERTO(p.nivel);
    const txt={0:"Operando: sin riesgo de cierre",1:"Posible riesgo de cierre",2:"Posible riesgo de cierre por seguridad",3:"Cierre parcial o total"}[p.nivel];
    L.marker([p.lat,p.lon],{icon:L.divIcon({className:"",html:`<div class="ico-pto" style="background:${c}"></div>`,iconSize:[16,16],iconAnchor:[8,8]})}).bindTooltip(p.nombre,{direction:"top"})
     .on("click",()=>abrirHoja(`<h3 id="hojaTit">${ic("puerto")} ${esc(p.nombre)}</h3><p><span class="pill" style="background:${c}">${txt}</span></p><p class="det">${esc(p.rol)}</p>`+
       ((p.reportes||[]).length?`<ul class="lista">${p.reportes.map(r=>`<li>${enlace(r.url,fuenteDe(r.titulo)[0])}<div class="det">${fechaPR(r.hora_utc)}</div></li>`).join("")}</ul>`:'<p class="det">Sin reportes de cierre en las últimas 48 h.</p>'))).addTo(lp);});
  // --- aeropuertos con problemas (triángulos) ---
  const la=g("aeropuertos");
  const arps=[...(m.aeropuertos||[])];Object.entries(ARPT_PR).forEach(([k,[la,lo]])=>{if(!arps.some(a=>a.arpt===k))arps.push({arpt:k,lat:la,lon:lo,nivel:0,problemas:[]})});
  arps.forEach(a=>{const c=CTRI(a.nivel);
    L.marker([a.lat,a.lon],{icon:L.divIcon({className:"",html:`<div class="ico-tri" style="border-bottom-color:${c}"></div>`,iconSize:[18,16],iconAnchor:[9,8]})})
     .bindTooltip(a.arpt,{direction:"top"})
     .on("click",()=>abrirHoja(`<h3 id="hojaTit">${ic("aeropuerto")} Aeropuerto ${esc(a.arpt)}</h3><p><span class="pill" style="background:${c};color:#000">${a.nivel>=3?"Cerrado o vuelos detenidos":a.nivel>=1?"Demoras o incidente":"Sin novedades"}</span></p>`+a.problemas.map(p=>dl([["Situación",`<b>${esc(p.tipo)}</b>`],["Motivo",esc(p.motivo)],["Hasta",esc(p.fin)]])).join("")+`<p>${enlace("https://nasstatus.faa.gov/","Estado oficial FAA")}</p>`)).addTo(la);});
  // --- aeronaves (últimas 6 posiciones en 3 h + dirección) ---
  const lv=g("aviones");
  (m.aviones||[]).forEach(a=>{const c=a.clase==="no identificada"?AMAR:COLPAIS(a.pais),tr=a.trazas||[];if(!tr.length)return;
    const pts=tr.map(p=>[p.lat,p.lon]),u=tr[tr.length-1];
    L.polyline(pts,{color:c,weight:2,opacity:.85}).addTo(lv);
    tr.slice(0,-1).forEach(p=>L.circleMarker([p.lat,p.lon],{radius:2.5,color:c,fillOpacity:1}).addTo(lv));
    if(u.rumbo!=null&&u.nudos)L.polyline([[u.lat,u.lon],destino(u.lat,u.lon,u.rumbo,u.nudos*1.852/3)],{color:c,weight:2,dashArray:"5 6",opacity:.9}).addTo(lv);
    const ab=()=>abrirHoja(`<h3 id="hojaTit">${ic("avion")} ${esc(a.callsign)}</h3><p><span class="pill" style="background:${c};color:#000">${a.clase==="no identificada"?"No identificado":c===AZUL?"Militar de EE. UU.":"Militar extranjero"}</span> ${esc(a.pais)}</p>`+
      dl([["Tipo",esc(a.tipo)+(a.desc?" · "+esc(a.desc):"")],["Última vez",fechaPR(u.t)],["Altitud",u.alt?esc(u.alt)+" ft":""],["Rumbo",u.rumbo!=null?Math.round(u.rumbo)+"°":""],
          ["Velocidad",u.nudos?Math.round(u.nudos)+" nudos":""],["Distancia a PR",a.dist_pr_km+" km"],["Posiciones (3 h)",tr.length]])+
      `<p class="det">La línea discontinua es la dirección probable en los próximos 20 min, según su rumbo y velocidad.</p><p>${enlace("https://globe.adsb.lol/?icao="+encodeURIComponent(a.hex),"Ver en ADS-B en vivo")}</p>`);
    L.marker([u.lat,u.lon],{icon:L.divIcon({className:"",html:`<div class="ico-avion" style="border-bottom-color:${c};transform:rotate(${u.rumbo||0}deg)"></div>`,iconSize:[14,16],iconAnchor:[7,8]})})
     .bindTooltip(a.callsign,{direction:"top"}).on("click",ab).addTo(lv);});
  // --- buques (AIS) ---
  const lb=g("buques");
  (m.buques||[]).forEach(b=>{const c=COLBUQ(b),tr=b.trazas||[];if(!tr.length)return;const u=tr[tr.length-1];
    L.polyline(tr.map(p=>[p.lat,p.lon]),{color:c,weight:2}).addTo(lb);
    if(u.rumbo!=null&&u.nudos)L.polyline([[u.lat,u.lon],destino(u.lat,u.lon,u.rumbo,u.nudos*1.852)],{color:c,weight:2,dashArray:"5 6"}).addTo(lb);
    L.circleMarker([u.lat,u.lon],{radius:7,color:"#fff",weight:2,fillColor:c,fillOpacity:1}).bindTooltip(b.nombre)
     .on("click",()=>abrirHoja(`<h3 id="hojaTit">${ic("barco")} ${esc(b.nombre)}</h3><p><span class="pill" style="background:${c};color:#000">${c===AZUL?"EE. UU.":c===ROJO?"Extranjero":"Sin bandera clara"} · ${esc(b.clase)}</span></p>`+
       dl([["MMSI",esc(b.mmsi)],["Última vez",fechaPR(u.t)],["Rumbo",u.rumbo!=null?Math.round(u.rumbo)+"°":""],["Velocidad",u.nudos!=null?u.nudos+" nudos":""],["Posiciones (3 h)",tr.length]])+
       `<p class="det">La línea discontinua es la dirección probable en la próxima hora.</p><p>${enlace("https://www.marinetraffic.com/en/ais/details/ships/mmsi:"+encodeURIComponent(b.mmsi),"Ver buque")}</p>`)).addTo(lb);});
  // --- satélites ---
  const ls=g("satelites");
  (m.satelites||[]).forEach(s=>{const c=COLSAT(s);
    const pas=s.traza.filter(p=>p[2]<=0).map(p=>[p[0],p[1]]),fut=s.traza.filter(p=>p[2]>=0).map(p=>[p[0],p[1]]);
    partir(pas).forEach(seg=>L.polyline(seg,{color:c,weight:1.5,opacity:.45,dashArray:"2 5"}).addTo(ls));
    partir(fut).forEach(seg=>L.polyline(seg,{color:c,weight:2,opacity:.8}).addTo(ls));
    const etq=c===AZUL?"EE. UU.":c===ROJO?"Extranjero":"No identificado";
    L.marker([s.lat,s.lon],{icon:L.divIcon({className:"",html:`<div class="ico-sat" style="color:${c}">${ic("satelite")}</div>`,iconSize:[18,18],iconAnchor:[9,9]})})
     .bindTooltip(s.nombre,{direction:"top"})
     .on("click",()=>abrirHoja(`<h3 id="hojaTit">${ic("satelite")} ${esc(s.nombre)}</h3><p><span class="pill" style="background:${c};color:#000">${etq}</span> ${esc(s.pais)} ${s.nuevo?'<span class="pill" style="background:#7c3aed">Lanzado en los últimos 30 días</span>':""}</p>`+
       dl([["NORAD",esc(s.norad)],["Altura actual",s.alt_km?s.alt_km+" km":""],["Paso más cercano a PR",s.dist_min_km+" km"]])+
       `<p class="det">Línea continua: trayectoria de los próximos 60 min. Punteada: últimos 30 min. Calculada con datos orbitales públicos (CelesTrak).</p><p>${enlace(s.url,"Ficha del satélite")}</p>`)).addTo(ls);});
  document.querySelectorAll(".hud button").forEach(b=>{if(b.classList.contains("off")&&CAPAS[b.dataset.capa])MAPA.removeLayer(CAPAS[b.dataset.capa]);});
  setTimeout(()=>MAPA.invalidateSize(),50);
}
function toggleCapa(b){b.classList.toggle("off");const c=CAPAS[b.dataset.capa];if(!c)return;b.classList.contains("off")?MAPA.removeLayer(c):c.addTo(MAPA);}

function abierto(id,def){try{const v=localStorage.getItem("pl_"+id);return v===null?def:v==="1"}catch(e){return def}}
document.addEventListener("toggle",e=>{const t=e.target;if(t.classList&&t.classList.contains("plegable")&&t.dataset.id){try{localStorage.setItem("pl_"+t.dataset.id,t.open?"1":"0")}catch(_){}}},true);
function fechaPR(iso){try{return new Date(iso).toLocaleString("es-PR",{timeZone:"America/Puerto_Rico",day:"numeric",month:"short",hour:"numeric",minute:"2-digit"})}catch(e){return iso}}
function fuenteDe(t){const i=t.lastIndexOf(" - ");return i>0?[t.slice(0,i),t.slice(i+3)]:[t,""];}
